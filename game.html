<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cat Dash Teacher</title><link rel="stylesheet" href="style.css"></head><body><main class="screen"><div class="container"><div class="topbar"><div><h1>🐱 CAT DASH <span class="pill" id="gamecode">---</span></h1><div class="pill" id="status">🟢 Lobby</div></div><div class="grid" style="grid-auto-flow:column"><button class="btn green" id="start">START GAME</button><button class="btn yellow" id="pause">PAUSE</button><button class="btn red" id="reset">RESET</button><button class="btn blue" id="sound">🔊 SOUND</button></div></div><section id="lobby" class="grid grid2"><div class="card center"><h2>SCAN TO JOIN</h2><img id="qr" class="qr" alt="Join QR code"><p id="joinurl" style="word-break:break-all"></p><h2 id="codeText">CAREER-000</h2></div><div class="card"><h2>Players <span id="count">0/5</span></h2><div id="players" class="players"></div><p>All five teams must join before the game starts.</p></div></section><section id="play" class="hidden"><div class="card center"><div class="pill" id="round">ROUND 0/12</div><h2 id="category">CATEGORY</h2><div id="question" class="question">Waiting...</div><div id="timer" class="big-score">10</div></div><div class="maze" id="maze"><div class="door a" id="door0">A</div><div class="door b" id="door1">B</div><div class="door c" id="door2">C</div><div class="finish">🏁 FINISH</div></div></section><section id="results" class="hidden card center"><h1>🎉 ROUND COMPLETE!</h1><div id="resultList" class="results"></div><button class="btn green" id="next">NEXT QUESTION ➜</button></section><section id="final" class="hidden card center"><h1>👑 CAREER MAZE CHAMPION</h1><div id="finalList"></div><button class="btn primary" onclick="location.reload()">NEW GAME</button></section></div></main><script src="/socket.io/socket.io.js"></script><script src="questions.js"></script><script src="game.js"></script></body></html>
