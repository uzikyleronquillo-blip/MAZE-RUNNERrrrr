<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Join Cat Dash</title><link rel="stylesheet" href="style.css"></head><body><main class="screen"><div class="phone"><div class="card center" id="joinCard"><h1>🐱 JOIN CAT DASH</h1><p class="subtitle">Enter your game code and team.</p><input id="code" placeholder="CAREER-472" autocomplete="off"><input id="team" placeholder="Team name" maxlength="24"><input id="player" placeholder="Player name (optional)" maxlength="24"><h3>Choose your cat</h3><div id="catPicks" class="cat-picks"></div><button id="join" class="btn primary" style="width:100%;margin-top:15px">JOIN GAME</button><p id="error" style="color:#d83a48;font-weight:900"></p></div><div class="card center hidden" id="wait"><h1 id="myTeam">🐱 READY!</h1><p>Watch the teacher screen.</p><div class="cat" id="myCat">🐱</div><p id="conn" class="status connected">🟢 CONNECTED</p><div id="phoneQuestion" class="hidden"><div class="pill" id="phoneRound"></div><h2 id="phoneQ"></h2><div id="phoneOptions" class="grid"></div><div id="phoneTimer" class="big-score">10</div></div><div id="locked" class="hidden"><h2>✅ ANSWER LOCKED!</h2><p>Watch your cat run! 🐱🏃</p></div><div id="phoneFinished" class="hidden"><h1>🎉 GAME OVER!</h1><p>Check the teacher screen for final results.</p></div></div></div></main><script src="/socket.io/socket.io.js"></script><script src="questions.js"></script><script src="player.js"></script></body></html>
